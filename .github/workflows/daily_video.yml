name: Daily BharatFacts Videos (3/day)

on:
  schedule:
    - cron: '0 20 * * 0-4'   # 7am AEDT Mon-Fri (20:00 UTC the day before)
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional: force a topic for this run'
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLAUDE_API_KEY:     ${{ secrets.CLAUDE_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      PIXABAY_API_KEY:    ${{ secrets.PIXABAY_API_KEY }}
      CF_ACCOUNT_ID:      ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN:       ${{ secrets.CF_API_TOKEN }}
      YT_CLIENT_ID:       ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET:   ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN:   ${{ secrets.YT_REFRESH_TOKEN }}
      TOPIC:              ${{ github.event.inputs.topic }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install packages
        run: pip install -q anthropic requests pillow google-api-python-client google-auth google-auth-oauthlib
      - name: Fetch fonts
        run: |
          mkdir -p fonts
          curl -sfL -o fonts/Poppins-Bold.woff https://cdn.jsdelivr.net/npm/@fontsource/poppins@5/files/poppins-latin-700-normal.woff
          curl -sfL -o fonts/NotoSansDevanagari-Bold.woff https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-devanagari@5/files/noto-sans-devanagari-devanagari-700-normal.woff
      - name: English video 1
        run: python youtube_automation.py english 0
      - name: English video 2
        if: always()
        run: python youtube_automation.py english 1
      - name: Hindi video 1
        if: always()
        run: python youtube_automation.py hindi 2
      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: |
            output/**/final_video.mp4
            output/**/plan.json
          retention-days: 14
